<!DOCTYPE html>
<!--
  Froala Editor with the CodeCogs Equation Editor plugin (eqneditor.js/.css in this folder).
  Run `npm install` here first to fetch Froala into node_modules.
  Replace the licence with your own fxTeX Pro licence key (fx_pk_...), from fxeditor.codecogs.com/purchase.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeCogs Equation Editor - Froala example</title>

    <link rel="stylesheet" href="./node_modules/froala-editor/css/froala_editor.pkgd.min.css">
    <script src="./node_modules/froala-editor/js/froala_editor.pkgd.min.js"></script>
    <link rel="stylesheet" href="./eqneditor.css">
    <script src="./eqneditor.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
               max-width: 900px; margin: 0 auto; padding: 24px; color: #1c2530; }
        p.hint { color: #52606d; font-size: 14px; }
    </style>
</head>
<body>
    <h1>CodeCogs Equation Editor in Froala</h1>
    <p class="hint">
        Press the <strong>fx</strong> button on the toolbar to insert an equation, or
        click the equation below to edit it.
    </p>

    <div id="editor">
        <!-- sample -->
        <p>Sample text and an equation:</p>
        <p><img src="https://fxtex.codecogs.com/svg.image?\sum_{i=0}^{n}a_i^2&plus;b"
                alt="\sum_{i=0}^{n}a_i^2+b"></p>
        <p>Click the equation above to edit it.</p>
        <!-- /sample -->
    </div>

    <script>
        new FroalaEditor( '#editor', {
            toolbarButtons: [ 'bold', 'italic', '|', 'eqneditor', '|', 'undo', 'redo' ],
            attribution: false,

            eqneditorServer: '{{EQN_SERVER}}',
            eqneditorLicence: '{{FXTEXPRO_KEY}}'
        } );
    </script>
</body>
</html>
